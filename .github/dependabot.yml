version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Non-major bumps land as a single weekly PR; majors get their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TS 7 (the Go port) drops parts of the JS compiler API that
      # @hey-api/openapi-ts and steiger's config loader still call.
      # See the TypeScript 7 note in AGENTS.md before lifting this.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
