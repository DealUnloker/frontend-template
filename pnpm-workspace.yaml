allowBuilds:
  lefthook: true
  sharp: true
minimumReleaseAge: 480
# @hey-api/json-schema-ref-parser pins js-yaml 5.3.0 (merge-key CPU,
# GHSA-r3ph-w7gj-g6xm); drop once hey-api moves to >=5.4.1
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': ^5.4.1
peerDependencyRules:
  allowedVersions:
    # tsconfck (via steiger) wants typescript ^5; TS 7 works fine with it
    'tsconfck>typescript': '>=6'
