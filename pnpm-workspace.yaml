allowBuilds:
  lefthook: true
  sharp: true
minimumReleaseAge: 480
# @hey-api/json-schema-ref-parser pins vulnerable js-yaml 4.2 (merge-key
# quadratic CPU); drop once hey-api moves to >=4.3
overrides:
  js-yaml: ^4.3.0
peerDependencyRules:
  allowedVersions:
    # tsconfck (via steiger) wants typescript ^5; TS 6 works fine with it
    'tsconfck>typescript': '>=6'
